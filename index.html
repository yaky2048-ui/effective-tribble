<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<meta name="color-scheme" content="light" />
<title>언제모여 - 시간/메뉴 조율</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper: #FFFFFF;
    --ink: #17181C;
    --ink-soft: #8B8B92;
    --ink-faint: #B8B8BE;
    --accent: #E8542F;
    --accent-soft: #FCEAE3;
    --accent-deep: #C7431F;
    --line: #EAE8E4;
    --line-strong: #D8D6D1;
    --danger: #C7431F;
    --white: #FFFFFF;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; color-scheme: light; }
  input, select, textarea, button{ color-scheme: light; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 18px 90px;
    min-height: 100vh;
  }
  @media (min-width: 768px){
    #app{ max-width: 720px; padding: 44px 26px 110px; }
  }
  @media (min-width: 1100px){
    #app{ max-width: 960px; }
  }
  h1{ font-size: 23px; font-weight: 700; margin: 4px 0 6px; letter-spacing: -0.02em; }
  h2{ font-size: 19px; font-weight: 700; margin: 0 0 16px; }
  .sub{ color: var(--ink-soft); font-size: 15px; margin: 0 0 22px; }
  .card{
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
  }
  label{ display:block; font-size: 15px; font-weight: 600; color: var(--ink); margin: 20px 0 8px; }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=date], input[type=time], input[type=datetime-local], input[type=url], input[type=number], select, textarea{
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    font-size: 17px;
    font-family: inherit;
    background: var(--white);
    color: var(--ink);
  }
  textarea{ resize: vertical; }
  input:focus, select:focus, button:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .row{ display:flex; gap: 10px; }
  .row > *{ flex: 1; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary{ background: var(--ink); color: var(--white); width: 100%; margin-top: 18px; }
  .btn-primary:disabled{ background: var(--ink-faint); cursor: not-allowed; }
  .btn-accent{ background: var(--accent); color: var(--white); width: 100%; margin-top: 18px; }
  .btn-accent:disabled{ background: var(--ink-faint); cursor: not-allowed; }
  .btn-ghost{ background: var(--white); color: var(--ink); border: 1px solid var(--line-strong); }
  .btn-outline-accent{ background: var(--white); color: var(--accent-deep); border: 1.5px solid var(--accent); }
  .btn-outline-accent:hover{ background: var(--accent-soft); }
  .btn-sm{ padding: 7px 12px; font-size: 15px; border-radius: 8px; }
  .btn-danger-ghost{ background: transparent; color: var(--danger); border: 1px solid #EFC9BC; }
  .deadline-trigger-btn{
    border: 1.5px solid var(--accent); border-radius: 9px; background: var(--white);
    color: var(--accent-deep); font-size: 14px; font-weight: 700; padding: 9px 14px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .deadline-trigger-btn:hover{ background: var(--accent-soft); }
  .deadline-trigger-btn.is-unset{
    background: var(--accent); color: var(--white); border-color: var(--accent);
    animation: deadline-pulse 1.8s ease-in-out infinite;
  }
  @keyframes deadline-pulse{
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,84,47,0.35); }
    50% { box-shadow: 0 0 0 5px rgba(232,84,47,0); }
  }
  #dl-selected-date.is-unset{ color: var(--accent-deep); font-weight: 700; }

  .chip-list{ display:flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip{
    display:flex; align-items:center; gap: 8px;
    background: var(--accent-soft); color: var(--accent-deep);
    padding: 6px 8px 6px 12px; border-radius: 999px; font-size: 15px; font-weight: 600;
  }
  .chip .chip-remove{
    background:none; border:none; color: var(--accent-deep); cursor:pointer;
    font-size: 14px; font-weight: 700; line-height:1; padding: 4px 6px; font-family: inherit;
  }
  .chip.chip-datetime{
    border-radius: 12px; padding: 8px 10px; width: 100%;
  }
  .chip-datetime .chip-date-label{ flex: 0 0 auto; min-width: 34px; }
  .chip-datetime input[type=time]{
    width: auto; flex: 1; min-width: 0; padding: 4px 6px; font-size: 14.5px;
    border-radius: 6px; background: var(--white);
  }

  /* --- 세그먼트 컨트롤 (선택방식) --- */
  .segmented{
    display:flex; border: 1px solid var(--line-strong); border-radius: 10px; padding: 3px; gap: 3px;
  }
  .segmented-btn{
    flex: 1; border: none; background: transparent; border-radius: 8px;
    padding: 10px 8px; font-size: 15.5px; font-weight: 600; color: var(--ink-soft);
    cursor: pointer; font-family: inherit; transition: background-color .12s ease, color .12s ease;
  }
  .segmented-btn.is-active{ background: var(--accent); color: var(--white); }

  /* --- 커스텀 캘린더 (컴팩트, 정사각형 형태) --- */
  .date-picker-row{ display:flex; gap: 14px; align-items:flex-start; flex-wrap: wrap; margin-top: 10px; }
  .calendar-wrap{
    position: relative;
    width: 240px; max-width: 100%;
    border: 1px solid var(--line); border-radius: 12px; padding: 14px;
    flex: 0 0 auto;
  }
  .selected-dates-col{ flex: 1; min-width: 130px; padding-top: 4px; }
  .selected-dates-col .label-inline{ font-size: 14px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; }
  .dl-selected-date-line{ display:flex; align-items:center; gap: 8px; }
  .dl-selected-date-line .label-inline{ font-size: 14px; font-weight: 700; color: var(--ink-soft); }
  .dl-selected-date-line #dl-selected-date{ font-weight: 700; font-size: 16px; }

  /* --- 시간 선택 스피너 (오전/오후 + 시:분 + 드롭다운) --- */
  .time-picker{ position: relative; }
  .tp-field-wrap{ position: relative; display: inline-block; }
  .tp-ampm{ display:flex; gap: 6px; margin-bottom: 8px; }
  .tp-ampm-btn{
    border: 1px solid var(--line-strong); border-radius: 8px; background: var(--white);
    color: var(--ink-soft); font-size: 14.5px; font-weight: 600; padding: 6px 10px;
    cursor: pointer; font-family: inherit;
  }
  .tp-ampm-btn.is-active{ background: var(--ink); color: var(--white); border-color: var(--ink); }
  .tp-hm{ display:flex; align-items:center; gap: 6px; font-size: 17px; font-weight: 700; }
  input.tp-field{
    border: 1.5px solid var(--line-strong); border-radius: 8px; background: var(--white);
    padding: 7px 12px; font-size: 17px; font-weight: 700; color: var(--ink);
    cursor: pointer; font-family: inherit; width: 52px !important; text-align: center;
  }
  .tp-field.is-open{ border-color: var(--accent); color: var(--accent-deep); }
  .tp-dropdown{
    display:none; position:absolute; z-index: 20; top: 100%; left: 0; margin-top: 4px;
    background: var(--white); border: 1px solid var(--line); border-radius: 10px;
    min-width: 60px; overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }
  .tp-dropdown.open-up{ top: auto; bottom: 100%; margin-top: 0; margin-bottom: 4px; }
  .tp-dropdown-inner{ max-height: 160px; overflow-y: auto; }
  .tp-option{
    padding: 8px 14px; font-size: 16px; color: var(--ink); cursor: pointer; text-align:center;
  }
  .tp-option:hover{ background: var(--line); }
  .tp-option.is-active{ color: var(--accent-deep); font-weight: 700; background: var(--accent-soft); }

  /* --- 공용 모달 --- */
  .modal-overlay{
    position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200;
    display:flex; align-items:center; justify-content:center; padding: 20px;
  }
  .modal-panel{
    background: var(--white); border-radius: 16px; padding: 22px;
    max-width: 360px; width: 100%; max-height: 85vh; overflow-y: auto; overflow-x: hidden;
  }
  .modal-panel h2{ margin: 0 0 14px; }
  .modal-panel.modal-panel-wide{ max-width: 360px; }
  @media (min-width: 480px){
    .modal-panel.modal-panel-wide{ max-width: 460px; }
    .modal-panel.modal-panel-wide .date-picker-row{ flex-wrap: nowrap; }
    .modal-panel.modal-panel-wide .selected-dates-col{ flex: 0 0 auto; min-width: 0; }
  }

  /* --- 투표페이지 후보 캘린더 --- */
  .vote-cal-day{
    aspect-ratio: 1; border: none; border-radius: 6px; padding: 0;
    display:flex; align-items:center; justify-content:center; font-size: 13.5px; font-weight: 600;
    cursor: pointer; font-family: inherit; -webkit-appearance:none; appearance:none;
    background: none; color: var(--ink);
  }
  .vote-cal-day:hover:not(:disabled){ background: var(--line); }
  .vote-cal-day.is-empty{ visibility: hidden; cursor:default; }
  .vote-cal-day.is-disabled{ color: var(--ink-faint); cursor: not-allowed; opacity: 0.4; }
  .vote-cal-day.is-candidate{ background: var(--accent-soft); color: var(--accent-deep); font-weight: 700; }
  .vote-cal-day.is-voted{ box-shadow: inset 0 0 0 2px var(--accent); }
  .vote-cal-legend{ display:flex; gap: 14px; margin-top: 10px; font-size: 13.5px; color: var(--ink-soft); }
  .vote-cal-hint{ margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
  .legend-dot{ display:inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: middle; background: var(--line); }
  .legend-dot.is-candidate{ background: var(--accent-soft); border: 1px solid var(--accent-deep); }
  .legend-dot.is-voted{ background: var(--white); box-shadow: inset 0 0 0 2px var(--accent); }
  .modal-slot-row{
    display:flex; align-items:center; gap: 10px; padding: 10px 4px;
    border-bottom: 1px solid var(--line); font-size: 16.5px; cursor: pointer;
  }
  .modal-slot-row:last-child{ border-bottom: none; }
  .modal-slot-row input[type=checkbox]{ width: 20px; height: 20px; accent-color: var(--accent); flex-shrink:0; }
  .calendar-header{ display:flex; align-items:center; justify-content: space-between; margin-bottom: 10px; }
  .calendar-header span{ font-weight: 700; font-size: 15px; }
  .cal-nav{
    background:none; border: 1px solid var(--line-strong); border-radius: 7px; padding: 4px 8px;
    font-size: 13.5px; font-weight: 600; color: var(--ink-soft); cursor:pointer; font-family: inherit;
  }
  .cal-nav:hover:not(:disabled){ border-color: var(--accent); color: var(--accent); }
  .cal-nav:disabled{ opacity: 0.35; cursor: not-allowed; }
  .calendar-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-day{
    aspect-ratio: 1; border: none; background: none; border-radius: 6px; padding: 0;
    -webkit-appearance: none; appearance: none;
    font-size: 13.5px; color: var(--ink); cursor: pointer; font-family: inherit;
  }
  .cal-day:hover:not(:disabled){ background: var(--line); }
  .cal-day.is-empty{ visibility: hidden; cursor: default; }
  .cal-day.is-disabled{ color: var(--ink-faint); cursor: not-allowed; opacity: 0.4; }
  .cal-day.is-sun{ color: var(--accent); }
  .cal-day.is-sun.is-disabled{ color: #F0C4B8; }
  .cal-day.is-selected{ background: var(--accent); color: var(--white); font-weight: 700; }

  .option-row{ display:flex; gap: 8px; margin-bottom: 8px; align-items:center; }
  .option-row input{ flex: 1; }

  .link-row{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin: 16px 0;
    display:flex; gap: 10px; align-items:center; justify-content: space-between; flex-wrap: wrap;
  }
  .link-row code{ font-size: 14px; word-break: break-all; color: var(--ink-soft); }

  .error-box{ background: var(--accent-soft); color: var(--danger); border-radius: 10px; padding: 12px 14px; font-size: 15px; margin: 10px 0; }
  .toast{ background: var(--accent-soft); color: var(--accent-deep); border-radius: 10px; padding: 12px 14px; font-size: 15px; margin: 10px 0; font-weight: 600; }

  /* --- room header --- */
  .room-header{ position: relative; margin-bottom: 22px; padding-bottom: 18px; padding-right: 84px; border-bottom: 1px solid var(--line); }
  .header-copy-btn{
    position: absolute; top: 0; right: 0;
    background: var(--white); border: 1px solid var(--line-strong); border-radius: 8px;
    color: var(--ink); font-size: 14px; font-weight: 600; padding: 6px 10px;
    cursor: pointer; font-family: inherit;
  }
  .header-copy-btn:hover{ border-color: var(--accent); color: var(--accent-deep); }
  .header-top{ display:flex; align-items:center; justify-content: space-between; }
  .eyebrow{
    display:inline-block; font-size: 14px; font-weight: 700; color: var(--accent-deep);
    background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; letter-spacing: .01em;
  }
  .deadline-badge{ font-size: 14.5px; font-weight: 800; color: var(--accent); }
  .deadline-badge.is-over{ color: var(--ink-soft); }
  .room-header .meta{ font-size: 15px; color: var(--ink); font-weight: 500; margin-top: 6px; }
  .place-badge{ font-size: 16px; color: var(--accent-deep); font-weight: 700; margin-top: 6px; }
  .badge-row{ display:flex; gap: 6px; margin: 10px 0 14px; flex-wrap: wrap; }
  .pill-badge{
    font-size: 14px; font-weight: 700; color: var(--accent-deep);
    background: var(--accent-soft); border: 1px solid var(--accent-soft); border-radius: 999px; padding: 4px 10px;
  }
  .header-actions{ display:flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .room-notice-box{
    display:flex; align-items:flex-start; gap: 8px;
    background: var(--ink); color: var(--white); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; font-weight: 600; line-height: 1.5; margin-top: 14px;
  }
  .notice-icon{ width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; color: var(--accent); }

  /* --- time-mode slot voting (탭형 로우, 얇은 진행바 + 실시간 인원수) --- */
  .slots-container{ display:flex; flex-direction: column; gap: 22px; }
  @media (min-width: 768px){
    .slots-container{ flex-direction: row; overflow-x: auto; gap: 16px; padding-bottom: 8px; }
    .date-col{ flex: 0 0 170px; }
  }
  .date-col-title{
    font-weight: 700; font-size: 15.5px; margin-bottom: 8px; color: var(--ink-soft);
    display:flex; align-items:center; justify-content:space-between;
  }
  .slot-item{
    position: relative; overflow: hidden;
    display:flex; align-items:center; justify-content: space-between; gap: 10px;
    padding: 11px 12px; border-bottom: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; user-select: none; transition: background-color .1s ease;
  }
  .slot-item .slot-item-bar{
    position:absolute; left:0; top:0; bottom:0; z-index:0;
    background: var(--line); width: 2px;
  }
  .slot-item .slot-time, .slot-item .slot-count{ position: relative; z-index: 1; font-size: 16.5px; }
  .slot-item .slot-count{ font-size: 14.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .slot-item.is-selected{ background: var(--accent-soft); color: var(--accent-deep); font-weight: 700; }
  .slot-item.is-selected .slot-item-bar{ background: #F5C7B6; }
  .slot-item.is-selected .slot-count{ color: var(--accent-deep); font-weight: 700; }

  /* --- menu-mode voting (모던 카드, 아이콘 없이 보더/배경으로 선택 표시) --- */
  .options-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .option-card{
    border:1px solid var(--line); border-radius:10px; padding: 10px;
    cursor: pointer; transition: border-color .12s ease, background-color .12s ease;
  }
  .option-card.is-selected{ border-color: var(--accent); background: var(--accent-soft); }
  .option-card .opt-name{ font-weight: 700; font-size: 14px; }
  .option-card.is-selected .opt-name{ color: var(--accent-deep); }
  .option-card a{ color: var(--accent); font-size: 12px; text-decoration: none; display: inline-block; margin-top: 4px; }
  .option-card a:hover{ text-decoration: underline; }
  .add-option-row{
    border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 13px;
    text-align:center; color: var(--ink-soft); font-size: 15.5px; font-weight: 600; cursor: pointer;
    background: none; width: 100%; font-family: inherit; margin-top: 14px;
  }
  .add-option-row:hover{ border-color: var(--accent); color: var(--accent); }
  .disclosure-btn-prominent{
    border: 1.5px solid var(--accent); border-radius: 12px; padding: 13px;
    text-align:center; color: var(--accent-deep); font-size: 15.5px; font-weight: 700; cursor: pointer;
    background: var(--accent-soft); width: 100%; font-family: inherit;
  }
  .disclosure-btn-prominent:hover{ background: var(--accent); color: var(--white); }
  .top-bar{ display:flex; align-items:center; gap:10px; margin-bottom: 26px; }
  .top-bar-back{
    background:none; border:none; font-size: 20px; line-height:1; color: var(--ink);
    cursor:pointer; padding: 4px 6px 4px 0; font-family: inherit;
  }
  .top-bar-title{ font-size: 16px; font-weight: 700; color: var(--ink); }
  .top-bar-action{
    margin-left: auto; background: var(--white); border: 1px solid var(--line-strong);
    border-radius: 8px; color: var(--ink); font-size: 13px; font-weight: 600;
    padding: 6px 10px; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .top-bar-action:hover{ border-color: var(--accent); color: var(--accent-deep); }
  .home-headline{ font-size: 27px; font-weight: 800; line-height: 1.32; letter-spacing: -0.02em; margin: 0 0 10px; }
  .home-sub{ font-size: 15.5px; color: var(--ink-soft); margin: 0 0 24px; line-height: 1.55; }

  .mode-list{ display:flex; flex-direction:column; gap: 14px; }
  .mode-list.has-form{ margin-bottom: 24px; }
  .mode-card-row{
    text-align:left; width:100%; background: var(--white);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 22px; cursor: pointer; font-family: inherit;
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    transition: border-color .12s ease, background-color .12s ease;
  }
  .mode-card-row:hover{ border-color: var(--accent); }
  .mode-card-row.is-active{ border-color: var(--accent); background: var(--accent-soft); }
  .mcr-content{ flex: 1; min-width: 0; }
  .mcr-tag{
    display:inline-block; background: var(--accent); color: var(--white);
    font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin-bottom: 8px;
  }
  .mcr-title{ font-weight: 800; font-size: 19px; color: var(--ink); margin-bottom: 6px; }
  .mode-card-row.is-active .mcr-title{ color: var(--accent-deep); }
  .mcr-desc{ font-size: 14.5px; color: var(--ink-soft); line-height: 1.5; }
  .mcr-arrow{ font-size: 19px; font-weight: 800; color: var(--ink); flex-shrink: 0; line-height: 1; }

  .recent-divider{ height: 1px; background: var(--line); margin: 26px 0 16px; }
  .recent-label{ font-size: 14px; color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; }
  .recent-item{ display:block; text-decoration:none; color:inherit; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .recent-item:last-child{ border-bottom:none; }
  .recent-item-top{ display:flex; align-items:center; gap: 8px; }
  .recent-item-title{ font-weight: 700; font-size: 16.5px; color: var(--ink); }
  .recent-item-badge{ font-size: 13.5px; font-weight: 800; color: var(--accent); }
  .recent-item-sub{ font-size: 14.5px; color: var(--ink-soft); margin-top: 2px; }

  .tie-hint{ font-size: 14.5px; color: var(--ink-soft); margin-top: 14px; text-align: center; }

  /* --- 구글 스타일 랜덤컬러 아바타 --- */
  .avatar-circle{
    border-radius: 50%; display:inline-flex; align-items:center; justify-content:center;
    color: #fff; font-weight: 800; flex-shrink: 0; font-family: inherit; line-height: 1;
  }
  .profile-grid{ display:flex; flex-wrap:wrap; gap: 14px; margin-top: 12px; }
  .profile-btn{
    display:flex; flex-direction:column; align-items:center; gap: 6px;
    background:none; border:none; cursor:pointer; font-family:inherit; width: 68px; padding: 0;
  }

<div id="app"></div>

<script>
/* =========================================================
   설정: Supabase 프로젝트 URL / anon key 를 여기에 채워넣으세요.
   Supabase 대시보드 > Project Settings > API 에서 확인 가능.
   ========================================================= */
const SUPABASE_URL = "https://drytifyhuwvocksewfcx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyeXRpZnlodXd2b2Nrc2V3ZmN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjU2MDgsImV4cCI6MjA5ODk0MTYwOH0.R0LhaanpGr1uvVLj31MmfDGxLs2vmSZufeUEQO8nl34";

let sb = null;
function getClient(){
  if(!sb){
    if(!window.supabase || SUPABASE_URL.includes("YOUR_SUPABASE")){
      return null;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  return sb;
}

/* ---------------- 실시간 반영 (Supabase Realtime) ---------------- */
let realtimeChannel = null;
function unsubscribeRealtime(){
  if(realtimeChannel){
    try{ getClient()?.removeChannel(realtimeChannel); }catch(e){}
    realtimeChannel = null;
  }
}
function subscribeRoomRealtime(roomId, onChange){
  unsubscribeRealtime();
  const client = getClient();
  if(!client) return;
  realtimeChannel = client.channel(`room-rt-${roomId}-${Date.now()}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'items', filter: `room_id=eq.${roomId}` }, onChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'participants', filter: `room_id=eq.${roomId}` }, onChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, onChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'responses' }, onChange)
    .subscribe();
}

const app = document.getElementById('app');

/* ---------------- 공용 모달 ---------------- */
function showModal(contentHtml){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'generic-modal-overlay';
  overlay.innerHTML = `<div class="modal-panel">${contentHtml}</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  return overlay;
}
function closeModal(){
  const overlay = document.getElementById('generic-modal-overlay');
  if(overlay) overlay.remove();
}
function showConfirmModal(message, onConfirm){
  const overlay = showModal(`
    <p style="font-size: 16.5px; margin:0 0 18px; line-height:1.5;">${escapeHtml(message)}</p>
    <div class="row" style="gap:8px;">
      <button type="button" class="btn btn-ghost" id="modal-no" style="margin-top:0;">아니오</button>
      <button type="button" class="btn btn-primary" id="modal-yes" style="margin-top:0;">예</button>
    </div>
  `);
  overlay.querySelector('#modal-no').addEventListener('click', closeModal);
  overlay.querySelector('#modal-yes').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
}
function showAlertModal(message, onOk){
  const overlay = showModal(`
    <p style="font-size: 16.5px; margin:0 0 18px; line-height:1.5;">${escapeHtml(message)}</p>
    <button type="button" class="btn btn-primary" id="modal-ok" style="margin-top:0;">확인</button>
  `);
  overlay.querySelector('#modal-ok').addEventListener('click', ()=>{ closeModal(); if(onOk) onOk(); });
}
function showPromptModal({ title, fields, onSubmit }){
  const overlay = showModal(`
    <h2>${escapeHtml(title)}</h2>
    ${fields.map(f => `
      <label>${escapeHtml(f.label)}</label>
      <input type="text" id="pm-${f.id}" placeholder="${escapeHtml(f.placeholder || '')}" value="${escapeHtml(f.value || '')}" />
    `).join('')}
    <div class="row" style="gap:8px; margin-top:16px;">
      <button type="button" class="btn btn-ghost" id="pm-cancel" style="margin-top:0;">취소</button>
      <button type="button" class="btn btn-primary" id="pm-submit" style="margin-top:0;">확인</button>
    </div>
  `);
  overlay.querySelector('#pm-cancel').addEventListener('click', closeModal);
  overlay.querySelector('#pm-submit').addEventListener('click', ()=>{
    const values = {};
    fields.forEach(f => { values[f.id] = document.getElementById(`pm-${f.id}`).value.trim(); });
    closeModal();
    onSubmit(values);
  });
}
function showCopyFallbackModal(text){
  const overlay = showModal(`
    <h2>링크 복사</h2>
    <p style="font-size:14.5px; color:var(--ink-soft); margin:0 0 10px;">아래 링크를 길게 눌러 복사해주세요</p>
    <input type="text" id="copy-fallback-input" value="${escapeHtml(text)}" readonly />
    <button type="button" class="btn btn-primary" id="copy-fallback-ok" style="margin-top:16px;">확인</button>
  `);
  const input = overlay.querySelector('#copy-fallback-input');
  input.focus(); input.select();
  overlay.querySelector('#copy-fallback-ok').addEventListener('click', closeModal);
}

// 날짜/시간 input을 클릭하면 어디를 눌러도 피커가 열리도록 (아이콘만 반응하는 기본 동작 보완)
document.addEventListener('click', (e) => {
  const el = e.target.closest('input[type="date"], input[type="time"], input[type="datetime-local"]');
  if(el && typeof el.showPicker === 'function'){
    try{ el.showPicker(); }catch(err){ /* 지원 안 하는 브라우저는 기본 동작으로 폴백 */ }
  }
});

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}
const AVATAR_COLORS = ['#E8542F','#2F5D50','#4C6EF5','#F59F00','#12B886','#E64980','#7048E8','#1098AD','#D9480F','#5C7CFA'];
function avatarColorFromName(name){
  let hash = 0;
  const str = String(name || '');
  for(let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
// 같은 방 안에서는 이름별로 색이 겹치지 않도록, 등장 순서대로 팔레트를 순차 배정
function buildAvatarColorMap(names){
  const map = {};
  let i = 0;
  for(const n of names){
    if(!(n in map)){
      map[n] = AVATAR_COLORS[i % AVATAR_COLORS.length];
      i++;
    }
  }
  return map;
}
function avatarHtml(name, size = 32, colorMap = null){
  const color = (colorMap && colorMap[name]) || avatarColorFromName(name);
  const initial = String(name || '?').trim().charAt(0).toUpperCase() || '?';
  return `<span class="avatar-circle" style="width:${size}px;height:${size}px;background:${color};font-size:${Math.round(size * 0.42)}px;">${escapeHtml(initial)}</span>`;
}
function fmtDateTimeLocal(d){
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function roundToNext10Min(d){
  const rounded = new Date(d);
  rounded.setSeconds(0, 0);
  rounded.setMinutes(Math.ceil(rounded.getMinutes() / 10) * 10);
  return rounded;
}
function fmtDeadline(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())} 마감`;
}
function dDayLabel(iso){
  const now = new Date();
  const dl = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  const timeStr = `${pad(dl.getHours())}:${pad(dl.getMinutes())}`;
  if(dl <= now) return '마감됨';
  const days = Math.ceil((dl - now) / (24*3600*1000));
  return days <= 0 ? `마감 오늘 ${timeStr}` : `마감 D-${days} ${timeStr}`;
}
function roomHeaderHtml(room, { metaExtra = '', badges = '' } = {}){
  const isLadder = room.room_type === 'ladder';
  const isOver = !isLadder && new Date() > new Date(room.deadline);
  const eyebrow = room.room_type === 'time' ? '시간 조율' : isLadder ? '벌칙뽑기 · 순서정하기' : (room.decide_target === 'place' ? '장소 결정' : '메뉴 결정');
  return `
    <div class="room-header">
      <button type="button" class="header-copy-btn" id="header-copy-btn">링크 복사</button>
      <div class="header-top">
        <div class="eyebrow">${eyebrow}</div>
        ${isLadder ? '' : `<div class="deadline-badge ${isOver ? 'is-over' : ''}">${dDayLabel(room.deadline)}</div>`}
      </div>
      <h1>${escapeHtml(room.title)}</h1>
      ${room.room_type === 'menu' && room.place_name ? `<div class="place-badge">장소 · ${escapeHtml(room.place_name)}</div>` : ''}
      <div class="meta">${metaExtra}</div>
      ${badges}
    </div>
  `;
}
function attachHeaderCopyBtn(room){
  const btn = document.getElementById('header-copy-btn');
  if(btn) btn.addEventListener('click', (e)=> copyToClipboard(shareUrl(room.id), e.target));
}
function noticeBoxHtml(notice){
  if(!notice) return '';
  return `
    <div class="room-notice-box">
      <svg class="notice-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 10v4a1 1 0 0 0 1 1h2.2l5.3 3.5a1 1 0 0 0 1.5-.85V6.35a1 1 0 0 0-1.5-.85L6.2 9H4a1 1 0 0 0-1 1Z" fill="currentColor"/>
        <path d="M15.5 8.5a4.5 4.5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M18 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      </svg>
      <span>${escapeHtml(notice)}</span>
    </div>
  `;
}
function shareUrl(roomId){
  return `${location.origin}${location.pathname}#/room/${roomId}`;
}
function resultsShareUrl(roomId){
  return `${location.origin}${location.pathname}#/room/${roomId}/results`;
}
async function copyToClipboard(text, btn){
  try{
    await navigator.clipboard.writeText(text);
    if(btn){ const old = btn.textContent; btn.textContent = '복사됨!'; setTimeout(()=>btn.textContent = old, 1500); }
  }catch(e){
    showCopyFallbackModal(text);
  }
}

/* ---------------- ROUTER ---------------- */
function route(){
  unsubscribeRealtime();
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(parts[0] === 'room' && parts[1]){
    if(parts[2] === 'results') renderResults(parts[1], false);
    else if(parts[2] === 'manage') renderManage(parts[1]);
    else renderRoom(parts[1]);
  } else if(parts[0] === 'create' && parts[1]){
    renderCreate(parts[1]);
  } else {
    renderCreate(null);
  }
}

function addRecentRoom(roomId){
  const key = 'schedRecentRoomIds';
  let ids = [];
  try{ ids = JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){ ids = []; }
  ids = ids.filter(id => id !== roomId);
  ids.unshift(roomId);
  localStorage.setItem(key, JSON.stringify(ids.slice(0, 5)));
}
function getRecentRoomIds(){
  try{ return JSON.parse(localStorage.getItem('schedRecentRoomIds') || '[]'); }catch(e){ return []; }
}
async function loadRecentRooms(){
  const section = document.getElementById('recent-rooms-section');
  const ids = getRecentRoomIds();
  if(!section || ids.length === 0) return;
  const client = getClient();
  const { data: rooms } = await client.from('rooms').select().in('id', ids);
  if(!rooms || rooms.length === 0) return;
  const { data: participants } = await client.from('participants').select('room_id').in('room_id', ids);
  const countByRoom = {};
  for(const p of participants || []) countByRoom[p.room_id] = (countByRoom[p.room_id] || 0) + 1;
  const roomById = Object.fromEntries(rooms.map(r => [r.id, r]));
  const ordered = ids.map(id => roomById[id]).filter(Boolean);
  const modeLabel = t => t === 'time' ? '시간 조율' : t === 'ladder' ? '벌칙뽑기 · 순서정하기' : '메뉴·장소 결정';
  section.innerHTML = `
    <div class="recent-divider"></div>
    <div class="recent-label">최근 방</div>
    ${ordered.map(r => {
      const isLadder = r.room_type === 'ladder';
      return `
        <a class="recent-item" href="#/room/${r.id}${isLadder ? '' : '/results'}">
          <div class="recent-item-top">
            <span class="recent-item-title">${escapeHtml(r.title)}</span>
            ${isLadder ? '' : `<span class="recent-item-badge">${dDayLabel(r.deadline)}</span>`}
          </div>
          <div class="recent-item-sub">${isLadder ? `${countByRoom[r.id] || 0}명 참여` : `${modeLabel(r.room_type)} · ${countByRoom[r.id] || 0}명 응답`}</div>
        </a>
      `;
    }).join('')}
  `;
}

function fmtDateStr(d){

let calendarViewDate = new Date();

/* ---------------- 마감일시 커스텀 피커 (모달: 달력 + 오전/오후 시:분 스피너) ---------------- */
let currentDeadlinePicker = null;

function createDeadlinePickerController(){
  const now = new Date();
  let selectedDateStr = fmtDateStr(now);
  let hour24 = now.getHours();
  let minute = now.getMinutes();
  let viewDate = new Date(now.getFullYear(), now.getMonth(), 1);
  let hasConfirmed = false;

  function getISOString(){
    if(!hasConfirmed) return null;
    const [y, m, d] = selectedDateStr.split('-').map(Number);
    return new Date(y, m - 1, d, hour24, minute, 0, 0).toISOString();
  }
  function getSummaryText(){
    if(!hasConfirmed) return '마감일시 선택 (필수)';
    const [y, m, d] = selectedDateStr.split('-');
    const ampmLabel = hour24 < 12 ? '오전' : '오후';
    let h12 = hour24 % 12; if(h12 === 0) h12 = 12;
    return `마감 ${Number(m)}/${Number(d)} ${ampmLabel} ${h12}:${String(minute).padStart(2, '0')}`;
  }

  function openModal(onApply){
    const overlay = showModal(`
      <h2>마감일시 선택</h2>
      <div class="dl-selected-date-line">
        <span class="label-inline">선택된 날짜</span>
        <span id="dl-selected-date"></span>
      </div>
      <div class="date-picker-row" style="margin-top:10px;">
        <div class="calendar-wrap" id="dl-cal-wrap">
          <div class="calendar-header">
            <button type="button" class="cal-nav" id="dl-cal-prev">이전달</button>
            <span id="dl-cal-month-label"></span>
            <button type="button" class="cal-nav" id="dl-cal-next">다음달</button>
          </div>
          <div class="calendar-grid" id="dl-cal-grid"></div>
        </div>
        <div class="selected-dates-col" style="flex: 0 0 auto; min-width: 0;">
          <div class="label-inline">시간</div>
          <div class="time-picker">
            <div class="tp-ampm">
              <button type="button" class="tp-ampm-btn" data-value="AM">오전</button>
              <button type="button" class="tp-ampm-btn" data-value="PM">오후</button>
            </div>
            <div class="tp-hm">
              <div class="tp-field-wrap">
                <input type="text" inputmode="numeric" maxlength="2" class="tp-field" id="dl-hour-btn" />
                <div class="tp-dropdown" id="dl-hour-dropdown"><div class="tp-dropdown-inner"></div></div>
              </div>
              <span>:</span>
              <div class="tp-field-wrap">
                <input type="text" inputmode="numeric" maxlength="2" class="tp-field" id="dl-minute-btn" />
                <div class="tp-dropdown" id="dl-minute-dropdown"><div class="tp-dropdown-inner"></div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <button type="button" class="btn btn-primary" id="dl-modal-confirm" style="margin-top:20px;">확인</button>
    `);
    const panelEl = overlay.querySelector('.modal-panel');
    if(panelEl) panelEl.classList.add('modal-panel-wide');

    function renderCal(){
      const grid = document.getElementById('dl-cal-grid');
      if(!grid) return;
      const year = viewDate.getFullYear(), month = viewDate.getMonth();
      document.getElementById('dl-cal-month-label').textContent = `${year}년 ${month + 1}월`;
      const now = new Date();
      document.getElementById('dl-cal-prev').disabled = (year === now.getFullYear() && month === now.getMonth());
      const firstDay = new Date(year, month, 1);
      const startOffset = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = fmtDateStr(now);
      let cells = '';
      for(let i = 0; i < startOffset; i++) cells += `<div class="cal-day is-empty"></div>`;
      for(let d = 1; d <= daysInMonth; d++){
        const dateObj = new Date(year, month, d);
        const dateStr = fmtDateStr(dateObj);
        const dow = dateObj.getDay();
        const isPast = dateStr < todayStr;
        const isSel = dateStr === selectedDateStr;
        let cls = 'cal-day';
        if(isPast) cls += ' is-disabled';
        if(isSel) cls += ' is-selected';
        if(dow === 0) cls += ' is-sun';
        cells += `<button type="button" class="${cls}" data-date="${dateStr}" ${isPast ? 'disabled' : ''}>${d}</button>`;
      }
      grid.innerHTML = cells;
      grid.querySelectorAll('.cal-day[data-date]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          selectedDateStr = btn.dataset.date;
          renderCal();
          updateSelectedLabel();
        });
      });
    }
    function updateSelectedLabel(){
      const el = document.getElementById('dl-selected-date');
      if(!selectedDateStr){ el.textContent = '날짜를 선택해주세요'; el.classList.add('is-unset'); return; }
      el.classList.remove('is-unset');
      const [y, m, d] = selectedDateStr.split('-');
      el.textContent = `${y}.${m}.${d}`;
    }
    function closeDropdowns(){
      document.getElementById('dl-hour-dropdown').style.display = 'none';
      document.getElementById('dl-minute-dropdown').style.display = 'none';
      document.getElementById('dl-hour-btn').classList.remove('is-open');
      document.getElementById('dl-minute-btn').classList.remove('is-open');
    }
    function updateTimeButtons(){
      const isPM = hour24 >= 12;
      overlay.querySelectorAll('.tp-ampm-btn').forEach(b=>{
        b.classList.toggle('is-active', (b.dataset.value === 'PM') === isPM);
      });
      let h12 = hour24 % 12; if(h12 === 0) h12 = 12;
      document.getElementById('dl-hour-btn').value = h12;
      document.getElementById('dl-minute-btn').value = String(minute).padStart(2, '0');
    }
    function buildHourOptions(){
      const dd = document.getElementById('dl-hour-dropdown').querySelector('.tp-dropdown-inner');
      let h12 = hour24 % 12; if(h12 === 0) h12 = 12;
      dd.innerHTML = Array.from({ length: 12 }, (_, i) => i + 1)
        .map(h => `<div class="tp-option ${h === h12 ? 'is-active' : ''}" data-value="${h}">${h}</div>`).join('');
      dd.querySelectorAll('.tp-option').forEach(opt=>{
        opt.addEventListener('click', ()=>{
          const h = parseInt(opt.dataset.value, 10);
          const isPM = hour24 >= 12;
          hour24 = isPM ? (h % 12) + 12 : (h % 12);
          updateTimeButtons();
          closeDropdowns();
        });
      });
    }
    function buildMinuteOptions(){
      const dd = document.getElementById('dl-minute-dropdown').querySelector('.tp-dropdown-inner');
      const mins = [0, 10, 20, 30, 40, 50];
      dd.innerHTML = mins.map(m => `<div class="tp-option ${m === minute ? 'is-active' : ''}" data-value="${m}">${String(m).padStart(2, '0')}</div>`).join('');
      dd.querySelectorAll('.tp-option').forEach(opt=>{
        opt.addEventListener('click', ()=>{
          minute = parseInt(opt.dataset.value, 10);
          updateTimeButtons();
          closeDropdowns();
        });
      });
    }
    function commitHourInput(){
      const el = document.getElementById('dl-hour-btn');
      let h12 = parseInt(el.value, 10);
      if(isNaN(h12) || h12 < 1 || h12 > 12){ updateTimeButtons(); return; }
      const isPM = hour24 >= 12;
      hour24 = isPM ? (h12 % 12) + 12 : (h12 % 12);
      updateTimeButtons();
    }
    function commitMinuteInput(){
      const el = document.getElementById('dl-minute-btn');
      let m = parseInt(el.value, 10);
      if(isNaN(m) || m < 0 || m > 59){ updateTimeButtons(); return; }
      minute = m;
      updateTimeButtons();
    }

    document.getElementById('dl-cal-prev').addEventListener('click', ()=>{ viewDate.setMonth(viewDate.getMonth() - 1); renderCal(); });
    document.getElementById('dl-cal-next').addEventListener('click', ()=>{ viewDate.setMonth(viewDate.getMonth() + 1); renderCal(); });
    overlay.querySelectorAll('.tp-ampm-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const wantPM = btn.dataset.value === 'PM';
        const isPM = hour24 >= 12;
        if(wantPM !== isPM) hour24 = wantPM ? (hour24 + 12) % 24 : (hour24 - 12 + 24) % 24;
        updateTimeButtons();
      });
    });
    const hourInput = document.getElementById('dl-hour-btn');
    const minuteInput = document.getElementById('dl-minute-btn');
    function positionDropdown(fieldEl, ddEl){
      const rect = fieldEl.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom;
      ddEl.classList.toggle('open-up', spaceBelow < 190);
    }
    hourInput.addEventListener('click', (e)=>{
      e.stopPropagation();
      const dd = document.getElementById('dl-hour-dropdown');
      const willOpen = dd.style.display !== 'block';
      closeDropdowns();
      if(willOpen){ buildHourOptions(); positionDropdown(hourInput, dd); dd.style.display = 'block'; hourInput.classList.add('is-open'); }
    });
    minuteInput.addEventListener('click', (e)=>{
      e.stopPropagation();
      const dd = document.getElementById('dl-minute-dropdown');
      const willOpen = dd.style.display !== 'block';
      closeDropdowns();
      if(willOpen){ buildMinuteOptions(); positionDropdown(minuteInput, dd); dd.style.display = 'block'; minuteInput.classList.add('is-open'); }
    });
    hourInput.addEventListener('input', ()=>{ hourInput.value = hourInput.value.replace(/[^0-9]/g, '').slice(0, 2); });
    minuteInput.addEventListener('input', ()=>{ minuteInput.value = minuteInput.value.replace(/[^0-9]/g, '').slice(0, 2); });
    hourInput.addEventListener('blur', commitHourInput);
    minuteInput.addEventListener('blur', commitMinuteInput);
    hourInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ commitHourInput(); closeDropdowns(); } });
    minuteInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ commitMinuteInput(); closeDropdowns(); } });
    document.getElementById('dl-modal-confirm').addEventListener('click', ()=>{
      if(!selectedDateStr){ showAlertModal('날짜를 선택해주세요.'); return; }
      commitHourInput(); commitMinuteInput();
      hasConfirmed = true;
      closeModal();
      if(onApply) onApply();
    });

    renderCal();
    updateSelectedLabel();
    updateTimeButtons();
  }

  return { getISOString, getSummaryText, openModal };
}

function renderDateChipContent(chip){
  const isDatetime = document.querySelector('.segmented-btn.is-active')?.dataset.value === 'datetime';
  const [y,m,d] = chip.dataset.date.split('-');
  if(isDatetime){
    chip.classList.add('chip-datetime');
    chip.innerHTML = `
      <span class="chip-date-label">${m}/${d}</span>
      <input type="time" class="chip-time-from" value="${chip.dataset.start || '09:00'}" />
      <span>~</span>
      <input type="time" class="chip-time-to" value="${chip.dataset.end || '21:00'}" />
      <button type="button" class="chip-remove">삭제</button>
    `;
    chip.querySelector('.chip-time-from').addEventListener('change', (e)=>{ chip.dataset.start = e.target.value; });
    chip.querySelector('.chip-time-to').addEventListener('change', (e)=>{ chip.dataset.end = e.target.value; });
  } else {
    chip.classList.remove('chip-datetime');
    chip.innerHTML = `<span>${m}/${d}</span><button type="button" class="chip-remove">삭제</button>`;
  }
  chip.querySelector('.chip-remove').addEventListener('click', ()=>{
    chip.remove();
    refreshCalendarIfOpen();
  });
}
function addDateChip(dateStr){
  const list = document.getElementById('date-chips');
  if([...list.children].some(c => c.dataset.date === dateStr)) return;
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.dataset.date = dateStr;
  chip.dataset.start = document.getElementById('f-start')?.value || '09:00';
  chip.dataset.end = document.getElementById('f-end')?.value || '21:00';
  renderDateChipContent(chip);
  list.appendChild(chip);
  refreshCalendarIfOpen();
}
function removeDateChip(dateStr){
  const list = document.getElementById('date-chips');
  const chip = [...list.children].find(c => c.dataset.date === dateStr);
  if(chip) chip.remove();
}
function refreshCalendarIfOpen(){
  const wrap = document.getElementById('calendar-wrap');
  if(wrap && wrap.style.display !== 'none') renderCalendar();
}
function renderCalendar(){
  const grid = document.getElementById('calendar-grid');
  if(!grid) return;
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  document.getElementById('cal-month-label').textContent = `${year}년 ${month + 1}월`;
  const now = new Date();
  const isAtCurrentMonth = year === now.getFullYear() && month === now.getMonth();
  const prevBtn = document.getElementById('cal-prev');
  if(prevBtn) prevBtn.disabled = isAtCurrentMonth;
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = fmtDateStr(new Date());
  const chosen = new Set([...document.getElementById('date-chips').children].map(c => c.dataset.date));
  let cells = '';
  for(let i = 0; i < startOffset; i++) cells += `<div class="cal-day is-empty"></div>`;
  for(let d = 1; d <= daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const dateStr = fmtDateStr(dateObj);
    const dow = dateObj.getDay();
    const isPast = dateStr < todayStr;
    const isSelected = chosen.has(dateStr);
    let cls = 'cal-day';
    if(isPast) cls += ' is-disabled';
    if(isSelected) cls += ' is-selected';
    if(dow === 0) cls += ' is-sun';
    cells += `<button type="button" class="${cls}" data-date="${dateStr}" ${isPast ? 'disabled' : ''}>${d}</button>`;
  }
  grid.innerHTML = cells;
  grid.querySelectorAll('.cal-day[data-date]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const ds = btn.dataset.date;
      if(chosen.has(ds)) removeDateChip(ds); else addDateChip(ds);
      renderCalendar();
    });
  });
}

function addOptionRow(prefillName = '', namePlaceholder = '항목명 (예: 파스타집)', includeLink = true){
  const rows = document.getElementById('option-rows');
  const row = document.createElement('div');
  row.className = 'option-row';
  row.innerHTML = `
    <input type="text" placeholder="${escapeHtml(namePlaceholder)}" class="opt-name-input" value="${escapeHtml(prefillName)}" />
    ${includeLink ? '<input type="url" placeholder="링크(선택)" class="opt-link-input" />' : ''}
    <button type="button" class="btn btn-danger-ghost btn-sm" style="flex:0 0 auto;">삭제</button>
  `;
  row.querySelector('button').addEventListener('click', ()=>{
    if(rows.children.length > 1) row.remove();
  });
  rows.appendChild(row);
}

function showFormError(msg){
  const box = document.getElementById('f-error');
  box.textContent = msg;
  box.style.display = 'block';
}

function generateDateOnlySlots(dates){
  const sortedDates = [...dates].sort();
  return sortedDates.map((date, i) => ({
    slot_date: date,
    slot_time: null,
    label: '종일',
    sort_order: i
  }));
}

function generateTimeSlots(dates, startTime, endTime, intervalMin){
  const items = [];
  let order = 0;
  const [sh,sm] = startTime.split(':').map(Number);
  const [eh,em] = endTime.split(':').map(Number);
  const startMin = sh*60+sm, endMin = eh*60+em;
  const sortedDates = [...dates].sort();
  for(const date of sortedDates){
    for(let t = startMin; t < endMin; t += intervalMin){
      const hh = String(Math.floor(t/60)).padStart(2,'0');
      const mm = String(t%60).padStart(2,'0');
      items.push({
        slot_date: date,
        slot_time: `${hh}:${mm}:00`,
        label: `${hh}:${mm}`,
        sort_order: order++
      });
    }
  }
  return items;
}

// 일부 브라우저 확장 프로그램이 fetch 응답을 가로채면서 발생하는
// "DataCloneError: ...postMessage...Headers..." 오류를 방어적으로 처리.
// 실제로는 insert가 서버에 반영됐는데 클라이언트 쪽 응답 처리만 깨지는 경우가 있어,
// 에러가 이 패턴이면 방금 만든 room을 재조회해서 성공으로 간주한다.
function isPostMessageCloneError(err){
  const msg = String(err && (err.message || err.name || err) || '');
  return msg.includes('DataCloneError') || msg.includes('postMessage') || msg.includes('could not be cloned');
}
async function insertRoomWithFallback(client, payload){
  try{
    const { data, error } = await client.from('rooms').insert(payload).select().single();
    if(error) throw error;
    return { room: data, error: null };
  }catch(err){
    if(isPostMessageCloneError(err)){
      await new Promise(r => setTimeout(r, 600));
      const { data: recent } = await client.from('rooms').select()
        .eq('title', payload.title).eq('room_type', payload.room_type)
        .order('created_at', { ascending: false }).limit(1);
      if(recent && recent.length) return { room: recent[0], error: null };
    }
    return { room: null, error: err };
  }
}

async function submitTimeRoom(){
  const title = document.getElementById('f-title').value.trim();
  const notice = document.getElementById('f-notice')?.value.trim() || null;
  const deadlineISO = currentDeadlinePicker ? currentDeadlinePicker.getISOString() : null;
  const chips = [...document.getElementById('date-chips').children];
  const timeMode = document.querySelector('.segmented-btn.is-active').dataset.value; // 'datetime' | 'dateonly'
  const interval = Number(document.getElementById('f-interval').value);

  if(!title){ showFormError('제목을 입력해주세요.'); return; }
  if(!deadlineISO){ showFormError('마감일시를 선택해주세요.'); return; }
  if(chips.length === 0){ showFormError('날짜를 하나 이상 추가해주세요.'); return; }

  let slotsPerDate = [];
  if(timeMode === 'dateonly'){
    slotsPerDate = generateDateOnlySlots(chips.map(c => c.dataset.date));
  } else {
    for(const chip of chips){
      const date = chip.dataset.date;
      const s = chip.dataset.start || '09:00';
      const e = chip.dataset.end || '21:00';
      if(s >= e){ showFormError(`${date.replace(/-/g,'.')} 날짜는 종료 시간이 시작 시간보다 늦어야 해요.`); return; }
      slotsPerDate.push(...generateTimeSlots([date], s, e, interval));
    }
  }

  const btn = document.getElementById('f-submit');
  btn.disabled = true; btn.textContent = '만드는 중...';

  const client = getClient();
  const ownerToken = generateOwnerToken();
  const { room, error: roomErr } = await insertRoomWithFallback(client,
    { title, room_type: 'time', deadline: deadlineISO, owner_token: ownerToken, notice });
  if(roomErr || !room){ showFormError('방 생성 실패: ' + (roomErr?.message || '알 수 없는 오류')); btn.disabled=false; btn.textContent='방 만들기'; return; }
  localStorage.setItem(`sched:${room.id}:ownerToken`, room.owner_token || ownerToken);

  const slots = slotsPerDate.map(s => ({ room_id: room.id, ...s }));
  const { error: itemsErr } = await client.from('items').insert(slots);
  if(itemsErr){ showFormError('슬롯 생성 실패: ' + itemsErr.message); btn.disabled=false; btn.textContent='방 만들기'; return; }

  await createPreProfiles(client, room.id);
  renderCreateSuccess(room.id);
}

function generateOwnerToken(){
  if(typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'tok-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

/* ---------------- 참여자 프로필 그룹 (Supabase 저장, 코드로 기기 간 재사용) ---------------- */
function getCreatorCode(){
  let code = localStorage.getItem('schedCreatorCode');
  if(!code){
    code = generateShortCode();
    localStorage.setItem('schedCreatorCode', code);
  }
  return code;
}
function generateShortCode(len = 8){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // 헷갈리는 0/O, 1/I 제외
  let out = '';
  for(let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

let currentProfileGroupMembers = [];
let currentQuickProfileNames = [];

function renderParticipantBox(){
  const emptyEl = document.getElementById('participant-box-empty');
  const chipsEl = document.getElementById('quick-profile-chips');
  const linkBtn2 = document.getElementById('open-profile-group-btn-2');
  if(!chipsEl) return;
  const all = [...new Set([...currentProfileGroupMembers, ...currentQuickProfileNames])];
  if(all.length === 0){
    if(emptyEl) emptyEl.style.display = 'block';
    chipsEl.style.display = 'none';
    chipsEl.innerHTML = '';
    if(linkBtn2) linkBtn2.style.display = 'none';
    return;
  }
  if(emptyEl) emptyEl.style.display = 'none';
  if(linkBtn2) linkBtn2.style.display = 'block';
  chipsEl.style.display = 'flex';
  chipsEl.className = 'profile-grid';
  const colorMap = buildAvatarColorMap(all);
  chipsEl.innerHTML = all.map(name => `
    <button type="button" class="profile-btn profile-btn-removable" data-uname="${escapeHtml(name)}" title="눌러서 삭제">
      ${avatarHtml(name, 46, colorMap)}
      <span>${escapeHtml(name)}</span>
    </button>
  `).join('');
  chipsEl.querySelectorAll('.profile-btn[data-uname]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const name = btn.dataset.uname;
      currentProfileGroupMembers = currentProfileGroupMembers.filter(n => n !== name);
      currentQuickProfileNames = currentQuickProfileNames.filter(n => n !== name);
      renderParticipantBox();
    });
  });
}

function wireDisclosure(btnId, sectionId, openLabel, closeLabel){
  const btn = document.getElementById(btnId);
  const section = document.getElementById(sectionId);
  if(!btn || !section) return;
  btn.addEventListener('click', ()=>{
    const isOpen = section.style.display !== 'none';
    section.style.display = isOpen ? 'none' : 'block';
    btn.textContent = isOpen ? openLabel : closeLabel;
  });
}

function wireProfileGroupSection(){
  currentProfileGroupMembers = [];
  currentQuickProfileNames = [];
  const openBtn = document.getElementById('open-profile-group-btn');
  const openBtn2 = document.getElementById('open-profile-group-btn-2');
  if(!openBtn) return;
  renderParticipantBox();
  const openGroupModal = ()=>{
    openProfileGroupModal((group)=>{
      currentProfileGroupMembers = [...new Set([...currentProfileGroupMembers, ...group.members])];
      renderParticipantBox();
    });
  };
  openBtn.addEventListener('click', openGroupModal);
  if(openBtn2) openBtn2.addEventListener('click', openGroupModal);
  const quickInput = document.getElementById('quick-profile-input');
  if(quickInput){
    quickInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        const val = quickInput.value.trim();
        if(val && !currentQuickProfileNames.includes(val) && !currentProfileGroupMembers.includes(val)) currentQuickProfileNames.push(val);
        quickInput.value = '';
        renderParticipantBox();
      }
    });
  }
}

function wireLadderProfileSection(){
  const openBtn = document.getElementById('open-profile-group-btn');
  if(!openBtn) return;
  openBtn.addEventListener('click', ()=>{
    openProfileGroupModal((group)=>{
      document.getElementById('option-rows').innerHTML = '';
      group.members.forEach(name => addOptionRow(name, '예: 참여자 이름', false));
      document.getElementById('ladder-options-wrap').style.display = 'block';
    });
  });
  const quickInput = document.getElementById('quick-profile-input');
  if(quickInput){
    quickInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        const val = quickInput.value.trim();
        if(!val){ return; }
        addOptionRow(val, '예: 참여자 이름', false);
        document.getElementById('ladder-options-wrap').style.display = 'block';
        quickInput.value = '';
      }
    });
  }
}

async function openProfileGroupModal(onApply){
  const client = getClient();
  let myCode = getCreatorCode();
  let groups = [];
  let editingId = null; // 'new' 또는 group.id
  let draftName = '';
  let draftMembers = [];
  let showCodeSwitch = false;
  let loading = true;

  async function loadGroups(){
    loading = true;
    render();
    const { data } = await client.from('profile_groups').select().eq('creator_code', myCode).order('created_at', { ascending: true });
    groups = (data || []).map(g => ({ ...g, members: Array.isArray(g.members) ? g.members : [] }));
    loading = false;
    render();
  }

  function buildHtml(){
    return `
      <h2>참여자 프로필 관리</h2>
      <div class="pg-code-line">
        내 코드 <strong>${escapeHtml(myCode)}</strong>
        <button type="button" class="btn btn-ghost btn-sm" id="pg-copy-code" style="margin-top:0;">복사</button>
        <button type="button" class="btn btn-ghost btn-sm" id="pg-switch-code" style="margin-top:0;">다른 기기 코드 사용</button>
      </div>
      <div class="sub" style="margin:4px 0 14px;">이 코드를 다른 기기에서 입력하면 같은 그룹을 그대로 불러올 수 있어요.</div>
      ${showCodeSwitch ? `
        <div class="row" style="gap:8px; margin-bottom:14px;">
          <input type="text" id="pg-code-input" placeholder="다른 기기의 코드 입력" style="flex:1;" />
          <button type="button" class="btn btn-primary btn-sm" id="pg-code-apply" style="margin-top:0; flex:0 0 auto;">적용</button>
        </div>
      ` : ''}
      ${loading ? `<div class="loading" style="padding:20px 0;">불러오는 중...</div>` : `
        <div class="profile-group-list">
          ${groups.length === 0 ? `<div class="sub" style="margin:0 0 14px;">저장된 그룹이 없어요.</div>` : groups.map(g => {
            const gColorMap = buildAvatarColorMap(g.members);
            return `
            <div class="profile-group-row">
              <div class="pg-info">
                <div class="pg-card-header">
                  <div class="pg-name">${escapeHtml(g.name)}</div>
                  <span class="pg-count-badge">${g.members.length}명</span>
                </div>
                <div class="pg-avatar-stack">
                  ${g.members.slice(0,4).map(name => avatarHtml(name, 26, gColorMap)).join('')}
                  ${g.members.length > 4 ? `<span class="pg-avatar-more">+${g.members.length - 4}</span>` : ''}
                </div>
              </div>
              <div class="pg-actions">
                ${onApply ? `<button type="button" class="btn btn-accent btn-sm" data-action="use" data-gid="${g.id}" style="margin-top:0;">사용하기</button>` : ''}
                <div class="pg-actions-row">
                  <button type="button" class="btn btn-ghost btn-sm" data-action="edit" data-gid="${g.id}" style="margin-top:0;">수정</button>
                  <button type="button" class="btn btn-danger-ghost btn-sm" data-action="delete" data-gid="${g.id}" style="margin-top:0;">삭제</button>
                </div>
              </div>
            </div>
          `;
          }).join('')}
        </div>
        ${editingId ? `
          <div class="profile-group-editor">
            <label>그룹 이름</label>
            <input type="text" id="pg-name-input" value="${escapeHtml(draftName)}" placeholder="예: 우리팀" />
            <label>참여자 추가 (이름 입력 후 Enter)</label>
            <input type="text" id="pg-member-input" placeholder="이름 입력 후 Enter" />
            <div class="profile-grid" id="pg-member-chips" style="margin-top:10px;">
              ${draftMembers.map(name => `
                <button type="button" class="profile-btn profile-btn-removable" data-remove="${escapeHtml(name)}" title="눌러서 삭제">
                  ${avatarHtml(name, 46, buildAvatarColorMap(draftMembers))}
                  <span>${escapeHtml(name)}</span>
                </button>
              `).join('')}
            </div>
            <div class="row" style="gap:8px; margin-top:16px;">
              <button type="button" class="btn btn-ghost" id="pg-cancel" style="margin-top:0;">취소</button>
              <button type="button" class="btn btn-primary" id="pg-save" style="margin-top:0;">저장</button>
            </div>
          </div>
        ` : `
          <button type="button" class="add-option-row" id="pg-new-btn" style="margin-top:14px;">+ 새 그룹 만들기</button>
        `}
      `}
    `;
  }

  function render(focusMemberInput){
    const overlay = showModal(buildHtml());
    const panelEl = overlay.querySelector('.modal-panel');
    if(panelEl) panelEl.classList.add('modal-panel-wide');
    attachEvents();
    if(focusMemberInput){
      const el = document.getElementById('pg-member-input');
      if(el) el.focus();
    }
  }

  function attachEvents(){
    const copyBtn = document.getElementById('pg-copy-code');
    if(copyBtn) copyBtn.addEventListener('click', (e) => copyToClipboard(myCode, e.target));
    const switchBtn = document.getElementById('pg-switch-code');
    if(switchBtn) switchBtn.addEventListener('click', ()=>{ showCodeSwitch = !showCodeSwitch; render(); });
    const codeApplyBtn = document.getElementById('pg-code-apply');
    if(codeApplyBtn){
      codeApplyBtn.addEventListener('click', async ()=>{
        const val = document.getElementById('pg-code-input').value.trim().toUpperCase();
        if(!val){ showAlertModal('코드를 입력해주세요.'); return; }
        myCode = val;
        localStorage.setItem('schedCreatorCode', myCode);
        showCodeSwitch = false;
        await loadGroups();
      });
    }
    if(loading) return;
    document.querySelectorAll('[data-action="use"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const g = groups.find(x => x.id === btn.dataset.gid);
        closeModal();
        if(g && onApply) onApply(g);
      });
    });
    document.querySelectorAll('[data-action="edit"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const g = groups.find(x => x.id === btn.dataset.gid);
        if(!g) return;
        editingId = g.id; draftName = g.name; draftMembers = [...g.members];
        render();
      });
    });
    document.querySelectorAll('[data-action="delete"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const g = groups.find(x => x.id === btn.dataset.gid);
        if(!g) return;
        showConfirmModal(`"${g.name}" 그룹을 삭제할까요?`, async ()=>{
          await client.from('profile_groups').delete().eq('id', g.id);
          await loadGroups();
        });
      });
    });
    const newBtn = document.getElementById('pg-new-btn');
    if(newBtn) newBtn.addEventListener('click', ()=>{
      editingId = 'new'; draftName = ''; draftMembers = [];
      render(true);
    });
    const memberInput = document.getElementById('pg-member-input');
    if(memberInput){
      memberInput.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){
          e.preventDefault();
          const val = memberInput.value.trim();
          if(val && !draftMembers.includes(val)) draftMembers.push(val);
          const nameInput = document.getElementById('pg-name-input');
          if(nameInput) draftName = nameInput.value;
          render(true);
        }
      });
    }
    document.querySelectorAll('.profile-btn[data-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        draftMembers = draftMembers.filter(n => n !== btn.dataset.remove);
        const nameInput = document.getElementById('pg-name-input');
        if(nameInput) draftName = nameInput.value;
        render(true);
      });
    });
    const cancelBtn = document.getElementById('pg-cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingId = null; render(); });
    const saveBtn = document.getElementById('pg-save');
    if(saveBtn){
      saveBtn.addEventListener('click', async ()=>{
        const nameInput = document.getElementById('pg-name-input');
        const name = nameInput.value.trim();
        if(!name){ showAlertModal('그룹 이름을 입력해주세요.'); return; }
        if(draftMembers.length === 0){ showAlertModal('참여자를 한 명 이상 추가해주세요.'); return; }
        saveBtn.disabled = true; saveBtn.textContent = '저장 중...';
        if(editingId === 'new'){
          const { error } = await client.from('profile_groups').insert({ creator_code: myCode, name, members: draftMembers });
          if(error){ showAlertModal('저장 실패: ' + error.message); saveBtn.disabled = false; saveBtn.textContent = '저장'; return; }
        } else {
          const { error } = await client.from('profile_groups').update({ name, members: draftMembers }).eq('id', editingId);
          if(error){ showAlertModal('저장 실패: ' + error.message); saveBtn.disabled = false; saveBtn.textContent = '저장'; return; }
        }
        editingId = null;
        await loadGroups();
      });
    }
  }

  await loadGroups();
}

async function submitMenuRoom(){

/* ---------------- ROOM (VOTE) PAGE ---------------- */
async function renderRoom(roomId){
  app.innerHTML = `<div class="loading">불러오는 중...</div>`;
  const client = getClient();
  const { data: room, error: roomErr } = await client.from('rooms').select().eq('id', roomId).single();
  if(roomErr || !room){
    app.innerHTML = `<div class="empty-state">방을 찾을 수 없어요.<br><a class="plain" href="#/create">새 방 만들기</a></div>`;
    return;
  }
  addRecentRoom(roomId);

  const { data: items } = await client.from('items').select().eq('room_id', roomId)
    .order('slot_date', { ascending: true }).order('slot_time', { ascending: true }).order('sort_order', { ascending: true });

  if(room.room_type === 'ladder'){
    renderLadderRoom(room, items || []);
    return;
  }

  if(new Date() > new Date(room.deadline)){
    location.hash = `#/room/${roomId}/results`;
    return;
  }

  const savedPid = localStorage.getItem(`sched:${roomId}:pid`);
  const savedName = localStorage.getItem(`sched:${roomId}:name`);
  let participant = null;
  if(savedPid){
    const { data } = await client.from('participants').select().eq('id', savedPid).maybeSingle();
    if(data) participant = data;
  }

  if(!participant){
    renderNamePrompt(room, items);
  } else {
    renderVoteForm(room, items, participant);
  }
}

/* ---------------- 벌칙뽑기 · 순서정하기 ---------------- */
async function ensureLadderParticipant(roomId){
  const key = `sched:${roomId}:ladderPid`;
  if(localStorage.getItem(key)) return;
  try{
    const participant = await getOrCreateParticipant(roomId, '참여자');
    localStorage.setItem(key, participant.id);
  }catch(e){ /* 카운트용이라 실패해도 기능엔 영향 없음 */ }
}

function shuffleIds(ids){
  const arr = [...ids];
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderLadderRoom(room, items, options = {}){
  const client = getClient();
  ensureLadderParticipant(room.id);
  const isDecided = Array.isArray(room.result_order) && room.result_order.length > 0;
  const order = isDecided ? room.result_order.map(id => items.find(it => it.id === id)).filter(Boolean) : [];
  const winner = order[0] || null;
  const rest = order.slice(1);
  const shouldAnimate = !!options.animate && isDecided;

  app.innerHTML = `
    ${roomHeaderHtml(room, { metaExtra: `후보 ${items.length}개` })}
    ${noticeBoxHtml(room.notice)}
    <div class="card" style="text-align:center;">
      ${!isDecided ? `
        <div class="prize-box-wrap"><div class="prize-box"><span class="prize-box-face">?</span></div></div>
        <button class="btn btn-accent" id="ladder-draw-btn" style="margin-top:20px;">뽑기</button>
      ` : `
        <div class="prize-box-wrap">
          <div class="prize-box ${shouldAnimate ? 'is-shaking' : ''}" id="prize-box">
            ${shouldAnimate
              ? `<span class="prize-box-face" id="prize-box-face">?</span>`
              : `<span class="prize-box-name">${escapeHtml(winner.label)}</span>`}
          </div>
        </div>
        <div class="prize-winner-label" id="prize-winner-label" style="${shouldAnimate ? 'opacity:0;' : ''}">1등 확정</div>
        ${rest.length ? `
          <div class="ladder-rest-list" id="ladder-rest-list" style="${shouldAnimate ? 'opacity:0;' : ''}">
            ${rest.map((it, i) => `
              <div class="result-item" style="cursor:default;">
                <div class="content">
                  <span class="label">${i + 2}등 · ${escapeHtml(it.label)}</span>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      `}
    </div>
  `;
  attachHeaderCopyBtn(room);

  if(shouldAnimate){
    setTimeout(() => {
      const box = document.getElementById('prize-box');
      const face = document.getElementById('prize-box-face');
      if(box) box.classList.remove('is-shaking');
      if(face) face.outerHTML = `<span class="prize-box-name prize-box-pop">${escapeHtml(winner.label)}</span>`;
      const winnerLabel = document.getElementById('prize-winner-label');
      if(winnerLabel){ winnerLabel.style.transition = 'opacity .4s ease'; winnerLabel.style.opacity = '1'; }
      const restList = document.getElementById('ladder-rest-list');
      if(restList){ restList.style.transition = 'opacity .5s ease'; restList.style.opacity = '1'; }
    }, 1100);
  }

  const drawBtn = document.getElementById('ladder-draw-btn');
  if(drawBtn){
    drawBtn.addEventListener('click', async () => {
      drawBtn.disabled = true; drawBtn.textContent = '뽑는 중...';
      const shuffled = shuffleIds(items.map(it => it.id));
      const { data, error } = await client.from('rooms')
        .update({ result_order: shuffled })
        .eq('id', room.id)
        .is('result_order', null)
        .select().maybeSingle();
      if(error){
        showAlertModal('결과 저장 실패: ' + error.message + '\n(Supabase에 migration_4.sql이 적용됐는지 확인해주세요)');
        drawBtn.disabled = false; drawBtn.textContent = '뽑기';
        return;
      }
      let finalRoom = data;
      if(!finalRoom){
        const { data: existing, error: fetchErr } = await client.from('rooms').select().eq('id', room.id).single();
        if(fetchErr || !existing){
          showAlertModal('결과를 불러오지 못했어요. 새로고침 후 다시 시도해주세요.');
          drawBtn.disabled = false; drawBtn.textContent = '뽑기';
          return;
        }
        finalRoom = existing;
      }
      renderLadderRoom(finalRoom, items, { animate: true });
    });
  }
}
