          return;
        }
        localStorage.setItem(`sched:${room.id}:pid`, data.id);
        localStorage.setItem(`sched:${room.id}:name`, data.name);
        renderVoteForm(room, items, data);
      });
    });
  }

  document.getElementById('name-submit').addEventListener('click', async ()=>{
    const nameInput = document.getElementById('name-input');
    const base = nameInput.value.trim();
    if(!base){
      const box = document.getElementById('name-error');
      box.textContent = '이름을 입력해주세요.'; box.style.display = 'block';
      return;
    }
    const btn = document.getElementById('name-submit');
    btn.disabled = true; btn.textContent = '입장 중...';
    try{
      const participant = await getOrCreateParticipant(room.id, base);
      localStorage.setItem(`sched:${room.id}:pid`, participant.id);
      localStorage.setItem(`sched:${room.id}:name`, participant.name);
      renderVoteForm(room, items, participant);
    }catch(e){
      const box = document.getElementById('name-error');
      box.textContent = '입장 실패: ' + e.message; box.style.display = 'block';
      btn.disabled = false; btn.textContent = '입장하기';
    }
  });
}

async function getOrCreateParticipant(roomId, baseName){
  const client = getClient();
  let name = baseName;
  for(let attempt = 0; attempt < 30; attempt++){
    const { data, error } = await client.from('participants')
      .insert({ room_id: roomId, name, is_claimed: true }).select().single();
    if(!error) return data;
    if(error.code === '23505'){
      name = `${baseName}_${attempt+1}`;
      continue;
    }
    throw error;
  }
  throw new Error('이름 중복이 너무 많아요.');
}

async function renderVoteForm(room, items, participant){
  const client = getClient();
  const { data: myResponses } = await client.from('responses').select('item_id').eq('participant_id', participant.id);
  const selected = new Set((myResponses || []).map(r => r.item_id));

  const itemIds = items.map(i => i.id);
  const { data: allResponses } = await client.from('responses').select('item_id')
    .in('item_id', itemIds.length ? itemIds : ['00000000-0000-0000-0000-000000000000']);
  const countMap = {};
  for(const it of items) countMap[it.id] = 0;
  for(const r of allResponses || []){ if(countMap[r.item_id] != null) countMap[r.item_id]++; }
  const maxCount = Math.max(1, ...Object.values(countMap));

  const url = shareUrl(room.id);
  const isTime = room.room_type === 'time';
  const hasTimeSlots = items.some(it => it.slot_time != null);
  const metaExtra = `<span class="meta-with-avatar">${avatarHtml(participant.name, 18)}${escapeHtml(participant.name)}님 · ${fmtDeadline(room.deadline)}</span>`;
  const badges = !isTime ? `<div class="badge-row"><span class="pill-badge">복수 선택 가능</span></div>` : '';

  let voteCalViewDate = new Date();

  function inferRoomTimePattern(){
    const times = [...new Set(items.filter(it => it.slot_time).map(it => it.slot_time))].sort();
    if(times.length === 0) return null;
    const start = times[0].slice(0, 5);
    let interval = 30;
    if(times.length >= 2){
      const [h1, m1] = times[0].split(':').map(Number);
      const [h2, m2] = times[1].split(':').map(Number);
      const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
      if(diff > 0) interval = diff;
    }
    const [lh, lm] = times[times.length - 1].split(':').map(Number);
    const endMin = lh * 60 + lm + interval;
    const end = `${String(Math.floor(endMin / 60)).padStart(2, '0')}:${String(endMin % 60).padStart(2, '0')}`;
    return { start, end, interval };
  }

  function buildVoteCalendarHtml(){
    const candidateDates = new Set(items.map(it => it.slot_date));
    const year = voteCalViewDate.getFullYear(), month = voteCalViewDate.getMonth();
    const now = new Date();
    const isCurrentMonth = year === now.getFullYear() && month === now.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = fmtDateStr(now);
    const startDay = isCurrentMonth ? Math.max(1, now.getDate() - now.getDay()) : 1;
    const startOffset = new Date(year, month, startDay).getDay();
    let cells = '';
    for(let i = 0; i < startOffset; i++) cells += `<div class="vote-cal-day is-empty"></div>`;
    for(let d = startDay; d <= daysInMonth; d++){
      const dateStr = fmtDateStr(new Date(year, month, d));
      const isPast = dateStr < todayStr;
      const isCandidate = candidateDates.has(dateStr);
      const voted = items.some(it => it.slot_date === dateStr && selected.has(it.id));
      let cls = 'vote-cal-day';
      if(isPast) cls += ' is-disabled';
      if(isCandidate) cls += ' is-candidate';
      if(voted) cls += ' is-voted';
      cells += `<button type="button" class="${cls}" data-date="${dateStr}" ${isPast ? 'disabled' : ''}>${d}</button>`;
    }
    return `
      <div class="calendar-header">
        <button type="button" class="cal-nav" id="vote-cal-prev">이전달</button>
        <span>${year}년 ${month + 1}월</span>
        <button type="button" class="cal-nav" id="vote-cal-next">다음달</button>
      </div>
      <div class="calendar-grid">${cells}</div>
      <div class="vote-cal-legend">
        <span><i class="legend-dot is-candidate"></i>후보 날짜</span>
        <span><i class="legend-dot is-voted"></i>내가 투표함</span>
      </div>
      <div class="vote-cal-hint">후보 날짜 이외의 날짜를 선택하면 후보로 추가할 수 있어요.</div>
    `;
  }

  function refreshVoteCalendar(){
    const wrap = document.getElementById('vote-calendar-wrap');
    if(!wrap) return;
    wrap.innerHTML = buildVoteCalendarHtml();
    attachVoteCalendarEvents();
  }

  function toggleSlotSelection(id, forceState){
    const newState = forceState !== undefined ? forceState : !selected.has(id);
    if(newState) selected.add(id); else selected.delete(id);
  }

  function openDateSlotModal(dateStr){
    const slotsForDate = items.filter(it => it.slot_date === dateStr)
      .sort((a,b) => (a.slot_time || '').localeCompare(b.slot_time || ''));
    const [y, m, d] = dateStr.split('-');
    const overlay = showModal(`
      <h2>${Number(m)}/${Number(d)} 시간 선택</h2>
      <div id="date-slot-modal-list">
        ${slotsForDate.map(s => `
          <label class="modal-slot-row">
            <input type="checkbox" data-item-id="${s.id}" ${selected.has(s.id) ? 'checked' : ''} />
            <span>${escapeHtml(s.label)}</span>
          </label>
        `).join('')}
      </div>
      <button type="button" class="btn btn-primary" id="date-slot-modal-confirm" style="margin-top:16px;">확인</button>
    `);
    overlay.querySelectorAll('input[type=checkbox][data-item-id]').forEach(cb=>{
      cb.addEventListener('change', ()=>{ toggleSlotSelection(cb.dataset.itemId, cb.checked); });
    });
    document.getElementById('date-slot-modal-confirm').addEventListener('click', ()=>{
      closeModal();
      refreshVoteCalendar();
    });
  }

  function attachVoteCalendarEvents(){
    const prevBtn = document.getElementById('vote-cal-prev');
    const nextBtn = document.getElementById('vote-cal-next');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ voteCalViewDate.setMonth(voteCalViewDate.getMonth() - 1); refreshVoteCalendar(); });
    if(nextBtn) nextBtn.addEventListener('click', ()=>{ voteCalViewDate.setMonth(voteCalViewDate.getMonth() + 1); refreshVoteCalendar(); });
    document.querySelectorAll('.vote-cal-day[data-date]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const dateStr = el.dataset.date;
        if(el.classList.contains('is-candidate')){
          if(!hasTimeSlots){
            const it = items.find(i => i.slot_date === dateStr);
            if(it){ toggleSlotSelection(it.id); refreshVoteCalendar(); }
          } else {
            openDateSlotModal(dateStr);
          }
          return;
        }
        if(el.disabled) return;
        showConfirmModal(`${dateStr.replace(/-/g, '.')} 날짜를 후보로 추가하시겠습니까?`, async ()=>{
          await addCandidateDate(dateStr);
        });
      });
    });
  }

  async function addCandidateDate(dateStr){
    let newSlots;
    if(hasTimeSlots){
      const pattern = inferRoomTimePattern();
      newSlots = pattern ? generateTimeSlots([dateStr], pattern.start, pattern.end, pattern.interval) : generateDateOnlySlots([dateStr]);
    } else {
      newSlots = generateDateOnlySlots([dateStr]);
    }
    const existingKeys = new Set(items.map(it => `${it.slot_date}|${it.slot_time}`));
    newSlots = newSlots.filter(s => !existingKeys.has(`${s.slot_date}|${s.slot_time}`));
    if(newSlots.length === 0){ showAlertModal('이미 후보에 있는 날짜예요.'); return; }
    const payload = newSlots.map((s, i) => ({ room_id: room.id, ...s, sort_order: items.length + i }));
    const { data: newItems, error } = await client.from('items').insert(payload).select();
    if(error){ showAlertModal('추가 실패: ' + error.message); return; }
    newItems.forEach(ni => { items.push(ni); countMap[ni.id] = 0; });
    refreshVoteCalendar();
  }

  function renderBody(){
    if(isTime){
      return '';
    } else {
      return `<div class="options-grid" id="options-grid">` + items.map(it => {
        return `
          <div class="option-card ${selected.has(it.id) ? 'is-selected' : ''}" data-item-id="${it.id}">
            <div class="opt-name">${escapeHtml(it.label)}</div>
            ${it.link ? `<a href="${escapeHtml(it.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">참고 링크</a>` : ''}
          </div>
        `;
      }).join('') + `</div>
      <input type="text" id="quick-add-item-input"
        placeholder="${room.decide_target === 'place' ? '장소' : '메뉴'} 이름 또는 링크 입력 후 Enter" style="margin-top:12px;" />`;
    }
  }

  app.innerHTML = `
    ${roomHeaderHtml(room, { metaExtra, badges })}
    ${noticeBoxHtml(room.notice)}
    <div class="header-actions">
      <a class="btn btn-outline-accent btn-sm" style="text-decoration:none; display:inline-flex;" href="#/room/${room.id}/results">결과 보기</a>
    </div>
    ${isTime ? `<div class="calendar-wrap" id="vote-calendar-wrap" style="margin:16px auto 0;">${buildVoteCalendarHtml()}</div>` : ''}
    <div id="toast-area"></div>
    <div id="vote-body" style="margin-top:16px;">${renderBody()}</div>
    ${!isTime ? '<div class="tie-hint">동점이면 방장이 최종 조율해요</div>' : ''}
    ${isTime ? `
      <label style="margin-top:20px;">다른 요구사항이나 특이사항이 있으면 적어주세요 (선택)</label>
      <input type="text" id="free-text-input"
        placeholder="예: 저녁 7시 이후면 아무 때나 괜찮아요"
        value="${escapeHtml(participant.free_text || '')}" />
    ` : ''}
    <button class="btn btn-primary" id="vote-submit">${(selected.size > 0 || participant.free_text) ? '수정하기' : '제출하기'}</button>
  `;

  let isDragging = false;
  let dragSelectMode = null;
  let lastClickedSlotId = null;

  function applySlotState(el, id, select){
    if(select){ selected.add(id); el.classList.add('is-selected'); }
    else { selected.delete(id); el.classList.remove('is-selected'); }
    updateVoteCalendarVotedMarks();
  }

  function updateVoteCalendarVotedMarks(){
    document.querySelectorAll('.vote-cal-day[data-date]').forEach(el=>{
      const date = el.dataset.date;
      const voted = items.some(it => it.slot_date === date && selected.has(it.id));
      el.classList.toggle('is-voted', voted);
    });
  }

  function attachRowEvents(){
    const slotEls = [...document.querySelectorAll('.slot-item[data-item-id]')];
    slotEls.forEach(el=>{
      const id = el.dataset.itemId;
      el.addEventListener('mousedown', (e)=>{
        isDragging = true;
        if(e.shiftKey && lastClickedSlotId && lastClickedSlotId !== id){
          const ids = slotEls.map(x => x.dataset.itemId);
          const i1 = ids.indexOf(lastClickedSlotId);
          const i2 = ids.indexOf(id);
          if(i1 !== -1 && i2 !== -1){
            const [start, end] = i1 < i2 ? [i1, i2] : [i2, i1];
            const shouldSelect = !selected.has(id);
            for(let i = start; i <= end; i++){
              applySlotState(slotEls[i], slotEls[i].dataset.itemId, shouldSelect);
            }
          }
          dragSelectMode = null;
        } else {
          dragSelectMode = !selected.has(id);
          applySlotState(el, id, dragSelectMode);
        }
        lastClickedSlotId = id;
        e.preventDefault();
      });
      el.addEventListener('mouseenter', ()=>{
        if(isDragging && dragSelectMode !== null) applySlotState(el, id, dragSelectMode);
      });
      el.addEventListener('touchstart', ()=>{
        isDragging = true;
        dragSelectMode = !selected.has(id);
        applySlotState(el, id, dragSelectMode);
        lastClickedSlotId = id;
      }, { passive: true });
    });
    document.querySelectorAll('.option-card[data-item-id]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.dataset.itemId;
        if(selected.has(id)) selected.delete(id); else selected.add(id);
        el.classList.toggle('is-selected');
      });
    });
  }
  attachRowEvents();
  if(isTime) attachVoteCalendarEvents();
  document.addEventListener('mouseup', ()=>{ isDragging = false; dragSelectMode = null; });
  document.addEventListener('touchend', ()=>{ isDragging = false; dragSelectMode = null; });
  document.addEventListener('touchmove', (e)=>{
    if(!isDragging) return;
    const touch = e.touches[0];
    if(!touch) return;
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    const slotEl = target && target.closest && target.closest('.slot-item[data-item-id]');
    if(slotEl && dragSelectMode !== null) applySlotState(slotEl, slotEl.dataset.itemId, dragSelectMode);
  }, { passive: true });

  attachHeaderCopyBtn(room);

  function attachQuickAddItemInput(){
    const el = document.getElementById('quick-add-item-input');
    if(!el) return;
    el.addEventListener('keydown', async (e)=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const val = el.value.trim();
      if(!val) return;
      const isUrl = /^https?:\/\//i.test(val);
      const payload = isUrl ? { label: '링크 보기', link: val } : { label: val, link: null };
      el.disabled = true;
      const { data: newItem, error } = await client.from('items')
        .insert({ room_id: room.id, ...payload, sort_order: items.length })
        .select().single();
      if(error){ showAlertModal('추가 실패: ' + error.message); el.disabled = false; return; }
      items.push(newItem);
      countMap[newItem.id] = 0;
      document.getElementById('vote-body').innerHTML = renderBody();
      attachRowEvents();
      attachQuickAddItemInput();
      const newInput = document.getElementById('quick-add-item-input');
      if(newInput) newInput.focus();
    });
  }
  attachQuickAddItemInput();

  document.getElementById('vote-submit').addEventListener('click', async ()=>{
    const btn = document.getElementById('vote-submit');
    btn.disabled = true; btn.textContent = '제출 중...';
    const freeTextEl = document.getElementById('free-text-input');
    const freeText = freeTextEl ? freeTextEl.value.trim() : '';
    await client.from('responses').delete().eq('participant_id', participant.id);
    if(selected.size){
      await client.from('responses').insert([...selected].map(itemId => ({ participant_id: participant.id, item_id: itemId })));
    }
    await client.from('participants').update({ free_text: freeText || null }).eq('id', participant.id);
    location.hash = `#/room/${room.id}/results`;
  });
}

/* ---------------- RESULTS PAGE ---------------- */
async function renderResults(roomId, isManage = false){
  app.innerHTML = `<div class="loading">불러오는 중...</div>`;
  const client = getClient();
  const { data: room, error: roomErr } = await client.from('rooms').select().eq('id', roomId).single();
  if(roomErr || !room){
    app.innerHTML = `<div class="empty-state">방을 찾을 수 없어요.</div>`;
    return;
  }
  addRecentRoom(roomId);
  if(room.room_type === 'ladder'){
    location.hash = `#/room/${roomId}`;
    return;
  }
  const { data: items } = await client.from('items').select().eq('room_id', roomId)
    .order('slot_date', { ascending: true }).order('slot_time', { ascending: true }).order('sort_order', { ascending: true });
  const { data: participants } = await client.from('participants').select().eq('room_id', roomId);
  const { data: responses } = await client.from('responses').select('item_id, participant_id')
    .in('item_id', (items || []).map(i => i.id).length ? items.map(i => i.id) : ['00000000-0000-0000-0000-000000000000']);

  const totalParticipants = (participants || []).length;
  const nameById = Object.fromEntries((participants || []).map(p => [p.id, p.name]));
  const resultColorMap = buildAvatarColorMap((participants || []).map(p => p.name));
  const countMap = {}; // item_id -> [names]
  for(const it of items || []) countMap[it.id] = [];
  for(const r of responses || []){
    if(countMap[r.item_id]) countMap[r.item_id].push(nameById[r.participant_id] || '익명');
  }
  const maxCount = Math.max(1, ...Object.values(countMap).map(arr => arr.length));
  const isPastDeadline = new Date() > new Date(room.deadline);
  const itemById = Object.fromEntries((items || []).map(it => [it.id, it]));
  const confirmedItem = room.confirmed_item_id ? itemById[room.confirmed_item_id] : null;

  const respondedIds = new Set((responses || []).map(r => r.participant_id));
  const votedParticipants = (participants || []).filter(p => respondedIds.has(p.id) || p.free_text);
  const notVotedParticipants = (participants || []).filter(p => !respondedIds.has(p.id) && !p.free_text);
  const statusBoardHtml = totalParticipants > 0 ? `
    <div class="status-board">
      <div class="status-board-count">${votedParticipants.length}<span class="status-board-total">/${totalParticipants}명 투표</span></div>
      ${notVotedParticipants.length ? `
        <div class="status-board-pending">
          <span class="label-inline">아직 안 한 사람</span>
          <div class="name-chip-row">${notVotedParticipants.map(p => `<span class="name-chip">${avatarHtml(p.name, 18, resultColorMap)}<span>${escapeHtml(p.name)}</span></span>`).join('')}</div>
        </div>
      ` : `<div class="status-board-pending-done">모두 투표 완료!</div>`}
    </div>
  ` : '';

  let confirmSelectedId = null;
  const isOrderAggregation = room.room_type === 'menu' && room.decide_target === 'menu'; // 개인별 주문 취합 목적 (승자 결정 아님)

  function namesRowHtml(names){
    if(!names.length) return '없음';
    return `<div class="name-chip-row">${names.map(n => `<span class="name-chip">${avatarHtml(n, 18, resultColorMap)}<span>${escapeHtml(n)}</span></span>`).join('')}</div>`;
  }

  function resultItemHtml(it){
    const names = countMap[it.id] || [];
    const pct = Math.round((names.length / maxCount) * 100);
    const isTop = !isOrderAggregation && names.length > 0 && names.length === maxCount;
    const isFullConsensus = totalParticipants > 0 && names.length === totalParticipants;
    const ratio = totalParticipants > 0 ? `${names.length}/${totalParticipants}` : `${names.length}명`;
    const isConfirmChoice = isManage && !confirmedItem && it.id === confirmSelectedId;
    return `
      <div class="result-item ${isTop ? 'is-top' : ''} ${isConfirmChoice ? 'is-confirm-selected' : ''}" data-item-id="${it.id}">
        <div class="bar-bg" style="width:${pct}%"></div>
        <div class="content">
          <span class="label">${escapeHtml(it.label)}${it.link ? ` · <a href="${escapeHtml(it.link)}" target="_blank" rel="noopener" style="font-size: 14px; color:inherit;">링크</a>` : ''}${isTop ? `<span class="stamp-badge">${isFullConsensus ? '전원 가능 · 최적' : '최다'}</span>` : ''}</span>
          <span class="count">${ratio}</span>
        </div>
        <div class="names">${namesRowHtml(names)}</div>
      </div>
    `;
  }

  function attachResultItemEvents(){
    document.querySelectorAll('.result-item[data-item-id]').forEach(el=>{
      el.addEventListener('click', ()=>{
        el.classList.toggle('expanded');
        if(!isManage || confirmedItem || isOrderAggregation) return; // 방장 관리페이지 + 승자결정 목적일 때만 확정 대상 선택 가능
        const id = el.dataset.itemId;
        confirmSelectedId = id;
        document.querySelectorAll('.result-item[data-item-id]').forEach(e2=>{
          e2.classList.toggle('is-confirm-selected', e2.dataset.itemId === id);
        });
        const confirmBtn = document.getElementById('confirm-btn');
        if(confirmBtn){
          const chosenItem = itemById[id];
          confirmBtn.textContent = `${room.room_type === 'time' ? formatConfirmedTime(chosenItem) : chosenItem.label}(으)로 확정`;
        }
      });
    });
  }

  function buildResultCalendarHtml(dateEntries, maxCount, selectedDate){
    const byYearMonth = {};
    dateEntries.forEach(d=>{
      const [y, m] = d.date.split('-');
      const key = `${y}-${m}`;
      if(!byYearMonth[key]) byYearMonth[key] = {};
      byYearMonth[key][d.date] = d;
    });
    const sortedKeys = Object.keys(byYearMonth).sort();
    return sortedKeys.map(key=>{
      const [year, month] = key.split('-').map(Number);
      const dataByDate = byYearMonth[key];
      const firstDay = new Date(year, month - 1, 1);
      const startOffset = firstDay.getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      let cells = '';
      for(let i = 0; i < startOffset; i++) cells += `<div class="result-cal-day is-empty"></div>`;
      for(let d = 1; d <= daysInMonth; d++){
        const dateStr = fmtDateStr(new Date(year, month - 1, d));
        const entry = dataByDate[dateStr];
        const count = entry ? entry.count : 0;
        const pct = count > 0 ? count / maxCount : 0;
        const bg = count > 0 ? `rgba(232,84,47,${(0.15 + 0.65 * pct).toFixed(2)})` : 'transparent';
        const textColor = pct > 0.55 ? '#fff' : 'var(--ink)';
        const isSel = dateStr === selectedDate;
        cells += `
          <button type="button" class="result-cal-day ${entry ? 'has-data' : ''} ${isSel ? 'is-selected' : ''}"
            data-date="${dateStr}" style="background:${bg}; color:${textColor};">
            <span class="rcd-day">${d}</span>
            ${count > 0 ? `<span class="rcd-count">${count}명</span>` : ''}
          </button>`;
      }
      return `
        <div class="result-calendar-block">
          <div class="result-calendar-title">${year}년 ${month}월</div>
          <div class="result-calendar-grid">${cells}</div>
        </div>
      `;
    }).join('');
  }

  function buildDetailPanelHtml(entry){
    if(!entry) return '';
    const [y, m, d] = entry.date.split('-');
    return `
      <div class="result-date-title">${m}/${d} 상세 <span class="rd-count">${entry.count}명</span></div>
      <div class="result-item-grid">${entry.slots.map(resultItemHtml).join('')}</div>
    `;
  }

  let bodyHtml = '';
  let topItem = null;
  let dateEntries = [];
  let bestBannerHtmlPiece = '';
  let calendarHtmlPiece = '';
  let detailPanelHtmlPiece = '';
  if(!items || items.length === 0){
    bodyHtml = `<div class="empty-state">등록된 항목이 없어요.</div>`;
  } else if(room.room_type === 'time'){
    let bestOverall = -1;
    for(const it of items){
      const c = (countMap[it.id]||[]).length;
      if(c > bestOverall){ bestOverall = c; topItem = it; }
    }
    confirmSelectedId = confirmedItem ? confirmedItem.id : (topItem ? topItem.id : null);

    const dateAggMap = {};
    for(const it of items){
      if(!dateAggMap[it.slot_date]) dateAggMap[it.slot_date] = { namesSet: new Set(), slots: [] };
      (countMap[it.id] || []).forEach(n => dateAggMap[it.slot_date].namesSet.add(n));
      dateAggMap[it.slot_date].slots.push(it);
    }
    dateEntries = Object.entries(dateAggMap).map(([date, agg]) => ({
      date, count: agg.namesSet.size,
      slots: agg.slots.sort((a,b) => (a.slot_time||'').localeCompare(b.slot_time||''))
    })).sort((a,b) => a.date.localeCompare(b.date));
    const maxDateCount = Math.max(1, ...dateEntries.map(d => d.count));
    let bestDateEntry = dateEntries[0] || null;
    for(const d of dateEntries) if(!bestDateEntry || d.count > bestDateEntry.count) bestDateEntry = d;

    bestBannerHtmlPiece = (bestDateEntry && bestDateEntry.count > 0) ? (() => {
      const [by, bm, bd] = bestDateEntry.date.split('-');
      return `<div class="result-best-date-banner">최다 득표일 <strong>${bm}/${bd}</strong> · ${bestDateEntry.count}명</div>`;
    })() : '';
    calendarHtmlPiece = buildResultCalendarHtml(dateEntries, maxDateCount, bestDateEntry ? bestDateEntry.date : null);
    detailPanelHtmlPiece = `<div id="result-detail-panel">${buildDetailPanelHtml(bestDateEntry)}</div>`;

    bodyHtml = `${bestBannerHtmlPiece}${calendarHtmlPiece}${detailPanelHtmlPiece}`;
  } else {
    const sorted = [...items].sort((a,b) => (countMap[b.id]||[]).length - (countMap[a.id]||[]).length);
    topItem = sorted[0];
    confirmSelectedId = confirmedItem ? confirmedItem.id : (topItem ? topItem.id : null);

    if(!isOrderAggregation){
      bodyHtml = `<div class="result-item-grid">${sorted.map(resultItemHtml).join('')}</div>`;
    } else {
      const orderMap = {}; // participant name -> [item labels]
      for(const r of responses || []){
        const name = nameById[r.participant_id];
        const item = itemById[r.item_id];
        if(name && item){
          if(!orderMap[name]) orderMap[name] = [];
          orderMap[name].push(item.label);
        }
      }
      const orderListHtml = (participants || []).length ? `
        <div class="order-summary-card">
          <div class="order-summary-title">인원별 주문 현황</div>
          ${(participants || []).map(p => {
            const orders = orderMap[p.name] || [];
            const text = orders.length ? orders.join(', ') : (p.free_text ? p.free_text : '아직 선택 안 함');
            const isEmpty = orders.length === 0 && !p.free_text;
            return `
              <div class="order-row">
                <div class="order-row-name">${avatarHtml(p.name, 26, resultColorMap)}<span>${escapeHtml(p.name)}</span></div>
                <div class="order-row-choice ${isEmpty ? 'is-empty' : ''}">${escapeHtml(text)}</div>
              </div>
            `;
          }).join('')}
        </div>
      ` : '';

      bodyHtml = `${orderListHtml}<div class="result-date-title" style="background:var(--ink); margin-top:20px;">메뉴별 집계</div><div class="result-item-grid">${sorted.map(resultItemHtml).join('')}</div>`;
    }
  }

  const isOwner = !!room.owner_token && localStorage.getItem(`sched:${roomId}:ownerToken`) === room.owner_token;
  const showConfirmSection = isManage && !isOrderAggregation && !confirmedItem && topItem && items && items.length > 0;
  const isTimeManageReorder = isManage && room.room_type === 'time';
  const mainResultsHtml = isTimeManageReorder ? (bestBannerHtmlPiece + detailPanelHtmlPiece) : bodyHtml;
  const freeTexts = (participants || []).filter(p => p.free_text);
  const freeTextHtml = freeTexts.length ? `
    <div class="result-date-title" style="background:var(--ink);">직접 제안</div>
    ${freeTexts.map(p => `
      <div class="result-item" style="cursor:default;">
        <div class="content">
          <span class="label" style="display:flex; align-items:center; gap:6px;">${avatarHtml(p.name, 20, resultColorMap)}${escapeHtml(p.name)}</span>
        </div>
        <div class="names" style="display:block; margin-top:6px;">${escapeHtml(p.free_text)}</div>
      </div>
    `).join('')}
  ` : '';

  app.innerHTML = `
    ${roomHeaderHtml(room, { metaExtra: `${votedParticipants.length}/${totalParticipants}명 응답` })}
    ${isManage ? `<div class="badge-row"><span class="pill-badge">방장 전용 관리 페이지</span></div>` : ''}
    ${statusBoardHtml}
    ${confirmedItem ? `
      <div class="confirmed-banner">
        <div class="cb-label">확정됨</div>
        <div class="cb-value">${escapeHtml(room.room_type === 'time' ? formatConfirmedTime(confirmedItem) : confirmedItem.label)}</div>
      </div>
    ` : ''}
    <div class="header-actions">
      ${!isPastDeadline ? `<a class="btn btn-ghost btn-sm" style="text-decoration:none; display:inline-flex;" href="#/room/${roomId}">응답하러 가기</a>` : ''}
      <button class="btn btn-ghost btn-sm" id="refresh-btn">새로고침</button>
      ${(!isManage && isOwner) ? `<a class="btn btn-outline-accent btn-sm" style="text-decoration:none; display:inline-flex;" href="#/room/${roomId}/manage">확정 관리로 이동</a>` : ''}
      ${isManage ? `<a class="btn btn-ghost btn-sm" style="text-decoration:none; display:inline-flex;" href="#/room/${roomId}/results">결과 보기 페이지로 이동</a>` : ''}
      ${isManage ? `<button type="button" class="btn btn-accent btn-sm" id="share-results-btn" style="margin-top:0;">결과 공유하기</button>` : ''}
    </div>
    <div style="margin-top:16px;">${mainResultsHtml}</div>
    ${freeTextHtml}
    ${showConfirmSection ? `
      <div class="tie-hint" style="margin-top:18px;">항목을 클릭하면 확정할 것을 바꿀 수 있어요</div>
      <div class="header-actions" style="margin-top:8px; flex-direction:column;">
        <a class="btn btn-ghost" style="text-decoration:none; display:flex; margin-bottom:8px;" href="#/room/${roomId}">내 응답 수정</a>
        <button class="btn btn-accent" id="confirm-btn" style="margin-top:0;">${escapeHtml(room.room_type === 'time' ? formatConfirmedTime(topItem) : topItem.label)}(으)로 확정</button>
      </div>
    ` : ''}
    ${(isManage && confirmedItem) ? `<button class="btn btn-ghost" id="cancel-confirm-btn" style="margin-top:14px; width:100%;">확정 취소</button>` : ''}
    ${isTimeManageReorder ? `<div style="margin-top:20px;">${calendarHtmlPiece}</div>` : ''}
  `;
  document.getElementById('refresh-btn').addEventListener('click', ()=> renderResults(roomId, isManage));
  const shareResultsBtn = document.getElementById('share-results-btn');
  if(shareResultsBtn) shareResultsBtn.addEventListener('click', (e)=> copyToClipboard(resultsShareUrl(roomId), e.target));
  attachHeaderCopyBtn(room);

  attachResultItemEvents();

  if(room.room_type === 'time'){
    document.querySelectorAll('.result-cal-day.has-data').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.result-cal-day').forEach(b => b.classList.remove('is-selected'));
        btn.classList.add('is-selected');
        const entry = dateEntries.find(d => d.date === btn.dataset.date);
        document.getElementById('result-detail-panel').innerHTML = buildDetailPanelHtml(entry);
        attachResultItemEvents();
      });
    });
  }

  const confirmBtn = document.getElementById('confirm-btn');
  if(confirmBtn){
    confirmBtn.addEventListener('click', async ()=>{
      confirmBtn.disabled = true; confirmBtn.textContent = '확정 중...';
      const { error } = await client.from('rooms').update({ confirmed_item_id: confirmSelectedId }).eq('id', roomId);
      if(error){ showAlertModal('확정 실패: ' + error.message); confirmBtn.disabled = false; return; }
      renderResults(roomId, isManage);
    });
  }

  const cancelBtn = document.getElementById('cancel-confirm-btn');
  if(cancelBtn){
    cancelBtn.addEventListener('click', async ()=>{
      cancelBtn.disabled = true; cancelBtn.textContent = '취소 중...';
      const { error } = await client.from('rooms').update({ confirmed_item_id: null }).eq('id', roomId);
      if(error){ showAlertModal('취소 실패: ' + error.message); cancelBtn.disabled = false; return; }
      renderResults(roomId, isManage);
    });
  }
}

async function renderManage(roomId){
  const client = getClient();
  const { data: room } = await client.from('rooms').select().eq('id', roomId).single();
  if(!room){ location.hash = `#/room/${roomId}/results`; return; }
  const token = localStorage.getItem(`sched:${roomId}:ownerToken`);
  if(!token || !room.owner_token || token !== room.owner_token){
    showAlertModal('방장만 접근할 수 있는 페이지예요.');
    location.hash = `#/room/${roomId}/results`;
    return;
  }
  renderResults(roomId, true);
}

function formatConfirmedTime(item){
  if(!item.slot_date) return item.label;
  const [y,m,d] = item.slot_date.split('-');
  return item.slot_time ? `${m}/${d} ${item.label}` : `${m}/${d} 종일`;
}
</script>
</body>
</html>
